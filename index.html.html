<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Days Since Calculator</title>
<style>
  :root{
    --ink: #12131a;
    --panel: #191b25;
    --paper: #f2ede4;
    --gold: #c9a24b;
    --gold-soft: #8a7143;
    --rule: #33364a;
    --good: #7fa89a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family: "Iowan Old Style","Palatino Linotype",Georgia,serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
  }
  .wrap{
    width:100%;
    max-width:640px;
  }
  .eyebrow{
    font-family: "Courier New", monospace;
    font-size:11px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:10px;
  }
  h1{
    font-size:28px;
    font-weight:400;
    margin:0 0 4px 0;
    letter-spacing:.01em;
  }
  .subline{
    font-family:"Courier New",monospace;
    font-size:12.5px;
    color:#a6a8b8;
    margin-bottom:32px;
  }
  .subline b{ color:var(--gold); font-weight:600; }

  .panel{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:28px 28px 24px;
    margin-bottom:24px;
  }

  .field-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .field{
    flex:1;
    min-width:150px;
  }
  label{
    display:block;
    font-family:"Courier New",monospace;
    font-size:10.5px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:#8d8fa3;
    margin-bottom:8px;
  }
  input[type="date"], input[type="time"]{
    width:100%;
    background:var(--ink);
    border:1px solid var(--rule);
    color:var(--paper);
    padding:10px 12px;
    font-family:"Courier New",monospace;
    font-size:14px;
    border-radius:2px;
    outline:none;
  }
  input[type="date"]:focus, input[type="time"]:focus{
    border-color:var(--gold);
  }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator{
    filter: invert(0.6) sepia(1) saturate(3) hue-rotate(0deg);
    cursor:pointer;
  }

  .quickrow{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .quickbtn{
    font-family:"Courier New",monospace;
    font-size:11px;
    letter-spacing:.05em;
    background:transparent;
    border:1px solid var(--rule);
    color:#b7b9c8;
    padding:7px 12px;
    border-radius:2px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .quickbtn:hover{
    border-color:var(--gold);
    color:var(--gold);
  }

  .result{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:32px 28px;
    position:relative;
    overflow:hidden;
  }
  .result::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--gold);
  }
  .direction{
    font-family:"Courier New",monospace;
    font-size:11px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:14px;
  }
  .bignum{
    font-size:56px;
    line-height:1;
    color:var(--gold);
    font-weight:400;
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  .bignum .unit{
    font-size:16px;
    font-family:"Courier New",monospace;
    color:#a6a8b8;
    letter-spacing:.05em;
  }
  .breakdown{
    margin-top:22px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:14px;
    border-top:1px solid var(--rule);
    padding-top:18px;
  }
  .bd-item{
    text-align:left;
  }
  .bd-num{
    font-family:"Courier New",monospace;
    font-size:20px;
    color:var(--paper);
  }
  .bd-label{
    font-family:"Courier New",monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#7d7f92;
    margin-top:4px;
  }
  .exact-line{
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--rule);
    font-family:"Courier New",monospace;
    font-size:12.5px;
    color:#a6a8b8;
    line-height:1.7;
  }
  .exact-line b{color:var(--paper); font-weight:600;}

  .footer-note{
    font-family:"Courier New",monospace;
    font-size:11px;
    color:#63657a;
    text-align:center;
    margin-top:20px;
    letter-spacing:.03em;
  }

  @media (max-width:480px){
    .breakdown{ grid-template-columns: repeat(2, 1fr); }
    .bignum{ font-size:42px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Time Elapsed</div>
  <h1>Days Since Calculator</h1>
  <div class="subline">Counting from birth: <b>09 June 2026, 12:03 PM</b></div>

  <div class="panel">
    <div class="field-row">
      <div class="field">
        <label>Compare to date</label>
        <input type="date" id="targetDate">
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="targetTime" value="00:00">
      </div>
    </div>
    <div class="quickrow">
      <button class="quickbtn" data-days="0">Today</button>
      <button class="quickbtn" data-days="30">+30 days</button>
      <button class="quickbtn" data-days="100">+100 days</button>
      <button class="quickbtn" data-days="365">+1 year</button>
    </div>
  </div>

  <div class="result">
    <div class="direction" id="direction">— select a date above —</div>
    <div class="bignum" id="bignum"><span id="bigval">0</span><span class="unit">total days</span></div>

    <div class="breakdown">
      <div class="bd-item"><div class="bd-num" id="bYears">0</div><div class="bd-label">Years</div></div>
      <div class="bd-item"><div class="bd-num" id="bMonths">0</div><div class="bd-label">Months</div></div>
      <div class="bd-item"><div class="bd-num" id="bDays">0</div><div class="bd-label">Days</div></div>
      <div class="bd-item"><div class="bd-num" id="bHours">0</div><div class="bd-label">Hours</div></div>
    </div>

    <div class="exact-line" id="exactLine"></div>
  </div>

  <div class="footer-note">All calculations use your local device time zone.</div>
</div>

<script>
  const BIRTH = new Date(2026, 5, 9, 12, 3, 0); // 09 June 2026, 12:03 PM (month is 0-indexed)

  const dateInput = document.getElementById('targetDate');
  const timeInput = document.getElementById('targetTime');

  function pad(n){ return n.toString().padStart(2,'0'); }

  function setInputsFromDate(d){
    dateInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    timeInput.value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function calcYMD(start, end){
    // ensure start <= end
    let a = start, b = end;
    let years = b.getFullYear() - a.getFullYear();
    let months = b.getMonth() - a.getMonth();
    let days = b.getDate() - a.getDate();
    let hours = b.getHours() - a.getHours();
    let mins = b.getMinutes() - a.getMinutes();

    if (mins < 0){ mins += 60; hours -= 1; }
    if (hours < 0){ hours += 24; days -= 1; }
    if (days < 0){
      const prevMonth = new Date(b.getFullYear(), b.getMonth(), 0);
      days += prevMonth.getDate();
      months -= 1;
    }
    if (months < 0){ months += 12; years -= 1; }

    return {years, months, days, hours, mins};
  }

  function formatDateTime(d){
    const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    const dateStr = d.toLocaleDateString('en-US', options);
    let h = d.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    const timeStr = `${h}:${pad(d.getMinutes())} ${ampm}`;
    return `${dateStr}, ${timeStr}`;
  }

  function update(){
    if (!dateInput.value) return;
    const [y,m,d] = dateInput.value.split('-').map(Number);
    const [th,tm] = (timeInput.value || '00:00').split(':').map(Number);
    const target = new Date(y, m-1, d, th, tm, 0);

    const future = target.getTime() >= BIRTH.getTime();
    const start = future ? BIRTH : target;
    const end = future ? target : BIRTH;

    const diffMs = Math.abs(target.getTime() - BIRTH.getTime());
    const totalDays = Math.floor(diffMs / 86400000);
    const totalHoursExtra = Math.floor((diffMs % 86400000) / 3600000);

    const ymd = calcYMD(start, end);

    document.getElementById('direction').textContent = future
      ? 'Time elapsed since birth'
      : 'Time before birth (target date precedes 09 June 2026)';

    document.getElementById('bigval').textContent = totalDays.toLocaleString();
    document.getElementById('bYears').textContent = ymd.years;
    document.getElementById('bMonths').textContent = ymd.months;
    document.getElementById('bDays').textContent = ymd.days;
    document.getElementById('bHours').textContent = ymd.hours;

    document.getElementById('exactLine').innerHTML =
      `From <b>${formatDateTime(BIRTH)}</b> to <b>${formatDateTime(target)}</b> — `+
      `<b>${totalDays.toLocaleString()}</b> full days and <b>${totalHoursExtra}</b> extra hour(s) `+
      `(≈ <b>${(totalDays/365.25).toFixed(2)}</b> years).`;
  }

  document.querySelectorAll('.quickbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const offset = parseInt(btn.dataset.days, 10);
      const d = new Date();
      d.setDate(d.getDate() + offset);
      d.setHours(0,0,0,0);
      setInputsFromDate(d);
      update();
    });
  });

  dateInput.addEventListener('change', update);
  timeInput.addEventListener('change', update);

  // initialize with today's date
  setInputsFromDate(new Date());
  update();
</script>
</body>
</html>
